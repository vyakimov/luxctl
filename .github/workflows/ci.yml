name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test (JSON-only contract)
        run: |
          chmod +x luxctl
          ./luxctl schema | python -c "import json,sys; assert json.load(sys.stdin)['ok']"
          ./luxctl --help | python -c "import json,sys; assert json.load(sys.stdin)['ok']"
          ./luxctl get | python -c "import json,sys; assert json.load(sys.stdin)['ok'] is False"
      - name: Smoke test (offline gating)
        run: |
          ./luxctl get light | python -c "
          import json,sys; d=json.load(sys.stdin)
          assert d['error']['type'] == 'selector_required', d"
          ./luxctl --raw get light --all | python -c "
          import json,sys; d=json.load(sys.stdin)
          assert d['error']['type'] == 'invalid_arguments', d"
